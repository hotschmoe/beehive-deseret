<!doctype html>
<meta charset="utf-8">
<title>Beehive Deseret Mono specimen</title>
<style>
@font-face { font-family: "Beehive Deseret Mono"; src: url("fonts/BeehiveDeseretMono-Regular.woff2") format("woff2"), url("fonts/BeehiveDeseretMono-Regular.ttf"); }
body { background: #fbf6ea; color: #2a1f10; font: 16px system-ui, sans-serif; margin: 2rem auto; max-width: 56rem; padding: 0 1rem; }
.d { font-family: "Beehive Deseret Mono"; letter-spacing: .08em; line-height: 1.5; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr)); gap: .5rem; }
.cell { border: 1px solid #d9c9a6; border-radius: 6px; padding: .4rem; text-align: center; }
.cell .d { font-size: 3rem; line-height: 1.3; }
.cell small { color: #7a4b12; display: block; }
</style>
<h1>Beehive Deseret Mono</h1>
<p class="d" style="font-size:2.4rem" id="sample"></p>
<div class="grid" id="grid"></div>
<script>
const names = "Long I,Long E,Long A,Long AH,Long O,Long OO,Short I,Short E,Short A,Short AH,Short O,Short OO,Ay,Ow,Wu,Yee,H,Pee,Bee,Tee,Dee,Chee,Jee,Kay,Gay,Ef,Vee,Eth,Thee,Es,Zee,Esh,Zhee,Er,El,Em,En,Eng,Oi,Ew".split(",");
const grid = document.getElementById("grid");
for (let i = 0; i < 40; i++) for (const base of [0x10400, 0x10428]) {
  const c = document.createElement("div");
  c.className = "cell";
  c.innerHTML = `<div class="d">${String.fromCodePoint(base + i)}</div><small>${names[i]}</small><small>U+${(base + i).toString(16).toUpperCase()}</small>`;
  grid.append(c);
}
const extras = [..."0123456789.,:;-'\"!?()/"].map(c => [c, c])
  .concat(["beehive", "honeybee", "sego lily", "temple", "all-seeing eye", "sunstone", "trumpet"].map((n, i) => [String.fromCodePoint(0xE000 + i), n]));
for (const [ch, label] of extras) {
  const c = document.createElement("div");
  c.className = "cell";
  c.innerHTML = `<div class="d">${ch}</div><small>${label}</small>`;
  grid.append(c);
}
document.getElementById("sample").textContent = [...Array(40).keys()].map(i => String.fromCodePoint(0x10400 + i)).join("");
</script>
